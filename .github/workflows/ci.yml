# CI — integración continua (Sesión 10).
#
# Qué hace: cada vez que subes código a GitHub (push a cualquier rama) o abres un
# pull request, una máquina limpia analiza la app y ejecuta las pruebas de la app,
# del proxy y del backend. Si algo
# falla, GitHub marca la subida con una ✗ roja y se ve ANTES de integrar el cambio.
#
# Es la «puerta de calidad» del proyecto. Sirve igual para el código que escribes
# tú que para el que escribe un agente de IA: lo que no pasa la puerta, no entra.
#
# Si una subida no dispara la ejecución (a veces pasa en un repositorio recién creado),
# puedes lanzarla a mano desde la pestaña Actions.
#
# Este workflow NO publica nada. La publicación del APK (entrega continua) está en
# release-apk.yml y se dispara con una etiqueta de versión.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: # también se puede ejecutar a mano: pestaña Actions → «CI» → «Run workflow»

permissions:
  contents: read # este workflow solo lee el código

# Si subes dos veces seguidas a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar las dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar las pruebas
        run: flutter test

  # El proxy del asistente no tiene dependencias: sus pruebas corren con el Node del runner.
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
      - name: Pruebas del proxy
        run: node --test proxy/proxy.test.js

  # Backend (FastAPI): sus pruebas necesitan un PostgreSQL de prueba, que GitHub levanta como servicio.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sazon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Valores solo para la base de prueba efímera del runner: no son secretos de ningún servidor real.
      SECRET_KEY: clave-solo-para-ci-no-es-secreta
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/sazon
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/sazon_test
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
      - name: Pruebas del backend
        run: uv run pytest -q
